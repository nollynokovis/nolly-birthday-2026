    <section class="section-title player-hero">
        <div class="section-inner">
            <span class="title-eyebrow">NOLLY BIRTHDAY CUP 2026</span>
            <span class="player-hero-game">STREET FIGHTER 6</span>
            <h1>PLAYER LIST</h1>
            <div class="title-deco"><span></span><span></span><span></span></div>
        </div>
    </section>

    <section id="player-list" class="section">
        <div class="section-inner" id="playerDirectory">
            <nav class="directory-switch" aria-label="Switch directory">
                <a href="teams-en.html">VALORANT</a>
                <span class="directory-switch-sep" aria-hidden="true">｜</span>
                <a href="players-en.html" aria-current="page">STREET FIGHTER 6</a>
            </nav>
            <div class="player-stats">
                <div class="player-stat">
                    <span class="player-stat-en">PLAYERS</span>
                    <span class="player-stat-num" data-stat="total">-</span>
                    <span class="player-stat-label">All Players</span>
                </div>
                <div class="player-stat player-stat-solo">
                    <span class="player-stat-en">SOLO</span>
                    <span class="player-stat-num" data-stat="solo">-</span>
                    <span class="player-stat-label">Individual</span>
                </div>
                <div class="player-stat player-stat-team">
                    <span class="player-stat-en">TEAM</span>
                    <span class="player-stat-num" data-stat="team">-</span>
                    <span class="player-stat-label">Team</span>
                </div>
            </div>

            <div class="player-controls">
                <div class="player-search">
                    <label class="visually-hidden" for="playerSearch">Search player name</label>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
                    <input type="search" id="playerSearch" placeholder="Search player name" autocomplete="off">
                </div>
                <div class="player-filters" role="group" aria-label="Filter by event">
                    <button type="button" class="filter-btn active" data-filter="all" aria-pressed="true">ALL</button>
                    <button type="button" class="filter-btn" data-filter="solo" aria-pressed="false">SOLO</button>
                    <button type="button" class="filter-btn" data-filter="team" aria-pressed="false">TEAM</button>
                </div>
                <div class="player-sort">
                    <button type="button" class="sort-toggle" aria-haspopup="true" aria-expanded="false" aria-controls="sortMenu">
                        <span class="sort-label">Sort</span><span class="sort-current">Entry order</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
                    </button>
                    <ul class="sort-menu" id="sortMenu" role="menu" hidden>
                        <li role="none"><button type="button" role="menuitemradio" aria-checked="true" data-sort="entry">Entry order</button></li>
                        <li role="none"><button type="button" role="menuitemradio" aria-checked="false" data-sort="rank-desc">Rank: High to Low</button></li>
                        <li role="none"><button type="button" role="menuitemradio" aria-checked="false" data-sort="rank-asc">Rank: Low to High</button></li>
                        <li role="none"><button type="button" role="menuitemradio" aria-checked="false" data-sort="name-asc">Name: A to Z</button></li>
                        <li role="none"><button type="button" role="menuitemradio" aria-checked="false" data-sort="name-desc">Name: Z to A</button></li>
                    </ul>
                </div>
            </div>

            <p class="player-result" aria-live="polite"></p>
            <div class="player-grid"></div>
            <nav class="pagination" aria-label="Pagination" hidden></nav>
        </div>
        <a href="schedule-sf6-en.html" class="btn-goods">BACK TO STREET FIGHTER 6 SCHEDULE</a>
